[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-log-analyzer"
version = "2.0.0"
description = "Tested security log analyzer with a guarded agent architecture."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Flask>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]
